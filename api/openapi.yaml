openapi: 3.0.3
info:
  title: Calculator API
  version: 1.0.0
  description: |
    Stateless calculator service. Every request performs exactly one operation.
    Numbers are IEEE-754 float64. Results that are not finite (NaN, ±Inf) are rejected.
paths:
  /api/v1/calculate:
    post:
      operationId: calculate
      summary: Perform one arithmetic operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateRequest'
            examples:
              divide:
                value: { operation: divide, operands: [10, 4] }
              sqrt:
                value: { operation: sqrt, operands: [16] }
      responses:
        '200':
          description: The result of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResponse'
        '400':
          description: Malformed request (bad JSON, unknown operation, wrong operand count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Well-formed request that is mathematically undefined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/operations:
    get:
      operationId: listOperations
      summary: List supported operations
      responses:
        '200':
          description: Supported operations, in display order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsResponse'
  /healthz:
    get:
      operationId: health
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
components:
  schemas:
    OperationName:
      type: string
      enum: [add, subtract, multiply, divide, power, sqrt, percent]
    CalculateRequest:
      type: object
      additionalProperties: false
      required: [operation, operands]
      properties:
        operation:
          $ref: '#/components/schemas/OperationName'
        operands:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: number
    CalculateResponse:
      type: object
      additionalProperties: false
      required: [operation, operands, result]
      properties:
        operation:
          $ref: '#/components/schemas/OperationName'
        operands:
          type: array
          items:
            type: number
        result:
          type: number
    Operation:
      type: object
      additionalProperties: false
      required: [name, symbol, arity, label]
      properties:
        name:
          $ref: '#/components/schemas/OperationName'
        symbol:
          type: string
        arity:
          type: integer
          enum: [1, 2]
        label:
          type: string
    OperationsResponse:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
    ErrorCode:
      type: string
      enum:
        - INVALID_JSON
        - UNSUPPORTED_OPERATION
        - INVALID_OPERANDS
        - UNSUPPORTED_MEDIA_TYPE
        - METHOD_NOT_ALLOWED
        - NOT_FOUND
        - DIVISION_BY_ZERO
        - DOMAIN_ERROR
        - NON_FINITE_RESULT
        - INTERNAL
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
